<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كيمو - مختبر الكتابة العربية</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f6f3;font-family:Arial,sans-serif;color:#183d30}
header{background:#145c43;color:white;padding:25px 18px;border-radius:0 0 25px 25px}
header h2{margin:0 0 8px}
main{padding:18px;max-width:600px;margin:auto}
.card{background:white;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 4px 18px #0000000b}
button,.upload{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#176b4d;color:white;font-size:16px;text-align:center;margin-top:12px}
.upload{background:#e4f2e9;color:#145c43;border:1px dashed #176b4d}
img{width:100%;border-radius:12px;margin-top:15px;display:none}
.note{color:#687b71;font-size:13px;line-height:1.8}
#status{margin-top:12px;font-size:14px}
</style>
</head>
<body>
<header>
<h2>كيمو | مختبر الكتابة العربية</h2>
<div>استخراج النصوص من صور الوثائق</div>
</header>
<main>
<div class="card">
<h3>اختر صورة الوثيقة</h3>
<p class="note">يمكنك التصوير بالكاميرا أو اختيار صورة محفوظة في هاتفك.</p>
<label class="upload" for="photo">📷 تصوير أو اختيار صورة</label>
<input id="photo" type="file" accept="image/*" capture="environment" hidden>
<img id="preview">
<div id="status">لم يتم اختيار صورة بعد.</div>
</div>
<div class="card">
<h3>النص المستخرج</h3>
<textarea id="result" placeholder="سيظهر النص المستخرج هنا بعد تجهيز محرك التعرف..." style="width:100%;height:150px;padding:12px;border:1px solid #d5e1d9;border-radius:12px;font-size:16px"></textarea>
<p class="note">يمكن مراجعة النص وتصحيحه يدويًا.</p>
</div>
</main>
<script>
const photo=document.getElementById('photo');
const preview=document.getElementById('preview');
const status=document.getElementById('status');
let currentImage=null;
photo.addEventListener('change',()=>{
const file=photo.files[0];
if(!file)return;
if(currentImage)URL.revokeObjectURL(currentImage);
currentImage=URL.createObjectURL(file);
preview.src=currentImage;
preview.style.display='block';
status.textContent='تم اختيار الصورة بنجاح. محرك استخراج النص لم يُدمج بعد.';
});
</script>
</body>
</html>
